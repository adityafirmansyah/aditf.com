<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760" fill="none">
  <defs>
    <marker id="mFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="380" height="760" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="20" y="30" font-family="Geist Mono, monospace" font-size="10" letter-spacing="0.06em" fill="#94A3B8">PRODUCTION TOPOLOGY</text>
  <line x1="20" y1="42" x2="360" y2="42" stroke="#E2E8F0"/>

  <!-- browser -->
  <g transform="translate(20, 58)">
    <rect width="340" height="62" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="14" y="26" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Browser / PWA</text>
    <text x="14" y="44" font-family="Geist, sans-serif" font-size="10" fill="#64748B">390px to 1920px, LCP budget 1.2s</text>
  </g>
  <line x1="190" y1="120" x2="190" y2="138" stroke="#2563EB" stroke-width="1.4" marker-end="url(#mFlow)"/>

  <!-- edge -->
  <g transform="translate(20, 142)">
    <rect width="340" height="70" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="14" y="24" font-family="Geist, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em" fill="#1D4ED8">EDGE</text>
    <text x="14" y="44" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Cloudflare CDN</text>
    <text x="14" y="60" font-family="Geist, sans-serif" font-size="10" fill="#475569">TLS, WAF, cache rules, 18ms static hit</text>
  </g>
  <line x1="190" y1="212" x2="190" y2="230" stroke="#2563EB" stroke-width="1.4" marker-end="url(#mFlow)"/>

  <!-- app -->
  <g transform="translate(20, 234)">
    <rect width="340" height="70" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="14" y="24" font-family="Geist, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em" fill="#64748B">APPLICATION</text>
    <text x="14" y="44" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Next.js App Router</text>
    <text x="14" y="60" font-family="Geist, sans-serif" font-size="10" fill="#475569">SSR, ISR, typed route handlers</text>
  </g>
  <line x1="190" y1="304" x2="190" y2="322" stroke="#2563EB" stroke-width="1.4" marker-end="url(#mFlow)"/>

  <!-- services -->
  <g transform="translate(20, 326)">
    <rect width="340" height="70" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="14" y="24" font-family="Geist, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em" fill="#64748B">SERVICES</text>
    <text x="14" y="44" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#0F172A">FastAPI workers</text>
    <text x="14" y="60" font-family="Geist, sans-serif" font-size="10" fill="#475569">Pydantic v2 schemas, 4 uvicorn procs</text>
  </g>
  <line x1="190" y1="396" x2="190" y2="414" stroke="#059669" stroke-width="1.4" marker-end="url(#mFlow)"/>

  <!-- data -->
  <g transform="translate(20, 418)">
    <rect width="340" height="150" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="14" y="24" font-family="Geist, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em" fill="#64748B">DATA LAYER</text>

    <g transform="translate(14, 36)">
      <rect width="312" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="10" y="20" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#0F172A">PostgreSQL 16</text>
      <text x="230" y="20" font-family="Geist Mono, monospace" font-size="9" fill="#475569">0.8ms</text>
    </g>
    <g transform="translate(14, 72)">
      <rect width="312" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="10" y="20" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Redis 7 cache</text>
      <text x="230" y="20" font-family="Geist Mono, monospace" font-size="9" fill="#475569">0.3ms</text>
    </g>
    <g transform="translate(14, 108)">
      <rect width="312" height="30" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="10" y="20" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#065F46">Object storage</text>
      <text x="228" y="20" font-family="Geist Mono, monospace" font-size="9" fill="#047857">signed</text>
    </g>
  </g>

  <!-- results strip -->
  <g transform="translate(20, 586)">
    <rect width="340" height="152" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="14" y="24" font-family="Geist, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em" fill="#64748B">MEASURED RESULTS</text>
    <g font-family="Geist, sans-serif" font-size="11" fill="#334155">
      <circle cx="18" cy="44" r="2.5" fill="#059669"/>
      <text x="30" y="48">TTFB 41ms, p99 34ms</text>
      <circle cx="18" cy="66" r="2.5" fill="#059669"/>
      <text x="30" y="70">20,000 SKU catalogue</text>
      <circle cx="18" cy="88" r="2.5" fill="#059669"/>
      <text x="30" y="92">99.98% availability</text>
      <circle cx="18" cy="110" r="2.5" fill="#059669"/>
      <text x="30" y="114">188 tests green, 0 critical CVEs</text>
      <circle cx="18" cy="132" r="2.5" fill="#059669"/>
      <text x="30" y="136">Staging deploy per milestone</text>
    </g>
  </g>

  <text x="20" y="752" font-family="Geist Mono, monospace" font-size="9" fill="#94A3B8">docker compose · Caddy · CI gate: lint, typecheck, vitest</text>
</svg>