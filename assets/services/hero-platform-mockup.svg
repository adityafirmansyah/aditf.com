        <text x="31" y="38" font-family="Geist, sans-serif" font-size="11" font-weight="700" fill="#2563EB">AF</text>
        <text x="58" y="28" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Aditya Firmansyah</text>
