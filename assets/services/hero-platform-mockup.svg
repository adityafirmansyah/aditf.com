        <path d="M 40 180 Q 90 160 140 170 T 240 150 T 340 165 T 440 135 T 540 145 T 640 120 T 700 130" stroke="#2563EB" stroke-width="2.5" fill="none"/>

        <!-- Target Threshold Line -->
        <line x1="40" y1="148" x2="700" y2="148" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4"/>
        <rect x="580" y="70" width="120" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0"/>
        <text x="590" y="85" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#065F46">SLO: &lt; 50ms (99.4%)</text>
