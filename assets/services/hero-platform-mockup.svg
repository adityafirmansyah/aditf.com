        <line x1="24" y1="130" x2="740" y2="130" stroke="#F1F5F9" stroke-width="1"/>
        <line x1="24" y1="170" x2="740" y2="170" stroke="#F1F5F9" stroke-width="1"/>
        <line x1="24" y1="210" x2="740" y2="210" stroke="#F1F5F9" stroke-width="1"/>

        <!-- Y Axis Labels -->
        <text x="710" y="86" font-family="Geist Mono, monospace" font-size="10" fill="#94A3B8">60ms</text>
        <text x="710" y="126" font-family="Geist Mono, monospace" font-size="10" fill="#94A3B8">40ms</text>
        <text x="710" y="166" font-family="Geist Mono, monospace" font-size="10" fill="#94A3B8">20ms</text>
        <text x="710" y="206" font-family="Geist Mono, monospace" font-size="10" fill="#94A3B8">0ms</text>

