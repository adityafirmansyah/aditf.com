      <!-- Code & Architecture Terminal Snippet -->
      <g transform="translate(0, 352)">
        <rect width="764" height="152" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
        <rect width="764" height="32" rx="12" fill="#F1F5F9"/>
        <rect y="20" width="764" height="12" fill="#F1F5F9"/>
        <line x1="0" y1="32" x2="764" y2="32" stroke="#E2E8F0" stroke-width="1"/>

        <circle cx="20" cy="16" r="4" fill="#CBD5E1"/>
        <circle cx="34" cy="16" r="4" fill="#CBD5E1"/>
        <circle cx="48" cy="16" r="4" fill="#CBD5E1"/>
        <text x="68" y="20" font-family="Geist Mono, monospace" font-size="11" fill="#475569">services/tenant_router.ts — Clean Architecture</text>

        <text x="24" y="60" font-family="Geist Mono, monospace" font-size="12" fill="#2563EB">export async function <tspan fill="#0F172A">resolveTenantContext</tspan>(<tspan fill="#475569">host: string</tspan>): Promise&lt;TenantPayload&gt; {</text>
        <text x="44" y="82" font-family="Geist Mono, monospace" font-size="12" fill="#475569">const cached = await redis.get(`tenant:${host}`);</text>
        <text x="44" y="104" font-family="Geist Mono, monospace" font-size="12" fill="#475569">if (cached) return JSON.parse(cached); // sub-millisecond edge resolution</text>
        <text x="44" y="126" font-family="Geist Mono, monospace" font-size="12" fill="#475569">return await db.tenants.findUnique({ where: { domain: host } });</text>
        <text x="24" y="144" font-family="Geist Mono, monospace" font-size="12" fill="#2563EB">}</text>
      </g>
