<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" fill="none" role="img" aria-label="Milestone schedule across three weeks, showing spec, staging and hardening as sequential bars on a calendar axis">
  <rect x="0" y="0" width="1040" height="300" fill="#FFFFFF"/>
  <line x1="0" y1="0" x2="1040" y2="0" stroke="#0F172A" stroke-width="2"/>
  <line x1="0" y1="38" x2="1040" y2="38" stroke="#E2E8F0"/>
  <text x="0" y="25" font-family="Geist Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#64748B">MILESTONE SCHEDULE · FIXED PRICE PER BAR</text>
  <text x="1040" y="25" font-family="Geist Mono, monospace" font-size="11" letter-spacing="0.04em" fill="#94A3B8" text-anchor="end">SIGNATURE → OWNERSHIP</text>

  <!-- calendar axis: week columns -->
  <line x1="200" y1="64" x2="200" y2="262" stroke="#E2E8F0"/>
  <line x1="404" y1="64" x2="404" y2="262" stroke="#E2E8F0"/>
  <line x1="608" y1="64" x2="608" y2="262" stroke="#E2E8F0"/>
  <line x1="812" y1="64" x2="812" y2="262" stroke="#E2E8F0"/>
  <line x1="1016" y1="64" x2="1016" y2="262" stroke="#E2E8F0"/>

  <text x="200" y="58" font-family="Geist Mono, monospace" font-size="10" letter-spacing="0.06em" fill="#94A3B8">WEEK 1</text>
  <text x="404" y="58" font-family="Geist Mono, monospace" font-size="10" letter-spacing="0.06em" fill="#94A3B8">WEEK 2</text>
  <text x="608" y="58" font-family="Geist Mono, monospace" font-size="10" letter-spacing="0.06em" fill="#94A3B8">WEEK 3</text>
  <text x="812" y="58" font-family="Geist Mono, monospace" font-size="10" letter-spacing="0.06em" fill="#94A3B8">WEEK 4</text>

  <!-- row 01: spec lock, day 1 -->
  <text x="0" y="90" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#2563EB">01</text>
  <text x="0" y="108" font-family="Geist, sans-serif" font-size="11" fill="#0F172A">Spec lock</text>
  <rect x="200" y="80" width="44" height="18" fill="#2563EB"/>
  <text x="256" y="93" font-family="Geist Mono, monospace" font-size="10" fill="#1D4ED8">24h, paid on acceptance</text>
  <line x1="0" y1="122" x2="1040" y2="122" stroke="#E2E8F0"/>

  <!-- row 02: build and staging -->
  <text x="0" y="148" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#2563EB">02</text>
  <text x="0" y="166" font-family="Geist, sans-serif" font-size="11" fill="#0F172A">Build and staging</text>
  <rect x="244" y="138" width="360" height="18" fill="#BFDBFE"/>
  <text x="616" y="151" font-family="Geist Mono, monospace" font-size="10" fill="#1D4ED8">10 to 14 working days, staging URL each merge</text>
  <line x1="0" y1="180" x2="1040" y2="180" stroke="#E2E8F0"/>

  <!-- row 03: hardening and handover -->
  <text x="0" y="206" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#059669">03</text>
  <text x="0" y="224" font-family="Geist, sans-serif" font-size="11" fill="#0F172A">Hardening and handover</text>
  <rect x="604" y="196" width="180" height="18" fill="#A7F3D0"/>
  <text x="796" y="209" font-family="Geist Mono, monospace" font-size="10" fill="#047857">3 to 5 days, keys and runbook</text>
  <line x1="0" y1="238" x2="1040" y2="238" stroke="#E2E8F0"/>

  <!-- warranty tail -->
  <text x="0" y="258" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#64748B">W</text>
  <text x="0" y="276" font-family="Geist, sans-serif" font-size="11" fill="#475569">Defect warranty</text>
  <rect x="784" y="248" width="256" height="18" fill="none" stroke="#A7F3D0" stroke-dasharray="3 2"/>
  <text x="792" y="261" font-family="Geist Mono, monospace" font-size="10" fill="#047857">30 days, no extra cost</text>

  <text x="0" y="292" font-family="Geist, sans-serif" font-size="10" fill="#64748B">Fixed price per milestone. No hourly drift, no change order surprise after signature.</text>
  <line x1="0" y1="299" x2="1040" y2="299" stroke="#0F172A" stroke-width="2"/>
</svg>
