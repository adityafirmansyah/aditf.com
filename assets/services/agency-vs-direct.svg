<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" fill="none">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Left column: agency chain -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="470" height="460" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

    <rect x="24" y="24" width="180" height="24" rx="6" fill="#FEE2E2"/>
    <text x="36" y="41" font-family="Geist, sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#B91C1C">TRADITIONAL AGENCY</text>

    <text x="24" y="78" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Four layers between you and the code</text>

    <!-- Chain nodes -->
    <g font-family="Geist, sans-serif">
      <rect x="24" y="98" width="422" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="50" cy="124" r="12" fill="#F1F5F9"/>
      <text x="45" y="128" font-size="10" font-weight="600" fill="#64748B">01</text>
      <text x="74" y="120" font-size="13" font-weight="600" fill="#0F172A">Client brief</text>
      <text x="74" y="137" font-size="11" fill="#64748B">Requirements explained three times</text>
      <text x="378" y="128" font-size="11" fill="#94A3B8">Day 1</text>

      <line x1="235" y1="150" x2="235" y2="164" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGrey)"/>

      <rect x="24" y="166" width="422" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="50" cy="192" r="12" fill="#F1F5F9"/>
      <text x="45" y="196" font-size="10" font-weight="600" fill="#64748B">02</text>
      <text x="74" y="188" font-size="13" font-weight="600" fill="#0F172A">Account manager translates the brief</text>
      <text x="74" y="205" font-size="11" fill="#64748B">Scope drifts, no technical review</text>
      <text x="370" y="196" font-size="11" fill="#94A3B8">Day 4</text>

      <line x1="235" y1="218" x2="235" y2="232" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGrey)"/>

      <rect x="24" y="234" width="422" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="50" cy="260" r="12" fill="#F1F5F9"/>
      <text x="45" y="264" font-size="10" font-weight="600" fill="#64748B">03</text>
      <text x="74" y="256" font-size="13" font-weight="600" fill="#0F172A">Junior developer builds from the ticket</text>
      <text x="74" y="273" font-size="11" fill="#64748B">No architecture owner, no production context</text>
      <text x="370" y="264" font-size="11" fill="#94A3B8">Week 3</text>

      <line x1="235" y1="286" x2="235" y2="300" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrowGrey)"/>

      <rect x="24" y="302" width="422" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="50" cy="328" r="12" fill="#F1F5F9"/>
      <text x="45" y="332" font-size="10" font-weight="600" fill="#64748B">04</text>
      <text x="74" y="324" font-size="13" font-weight="600" fill="#0F172A">Offshore QA signs off the handoff</text>
      <text x="74" y="341" font-size="11" fill="#64748B">Knowledge leaves with the contract</text>
      <text x="362" y="332" font-size="11" fill="#94A3B8">Week 12</text>
    </g>

    <rect x="24" y="372" width="422" height="62" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
    <text x="40" y="396" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#B91C1C">Effective engineering rate</text>
    <text x="40" y="418" font-family="Geist Mono, monospace" font-size="12" fill="#7F1D1D">12 week timeline, no single owner</text>
  </g>

  <!-- Right column: direct -->
  <g transform="translate(530, 0)">
    <rect x="0" y="0" width="470" height="460" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#cardShadow)"/>

    <rect x="24" y="24" width="196" height="24" rx="6" fill="#EFF6FF"/>
    <text x="36" y="41" font-family="Geist, sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#1D4ED8">DIRECT ARCHITECT</text>

    <text x="24" y="78" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#0F172A">One line, one owner, every decision</text>

    <g font-family="Geist, sans-serif">
      <rect x="24" y="98" width="422" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="50" cy="124" r="12" fill="#EFF6FF"/>
      <text x="45" y="128" font-size="10" font-weight="600" fill="#2563EB">01</text>
      <text x="74" y="120" font-size="13" font-weight="600" fill="#0F172A">You brief the architect directly</text>
      <text x="74" y="137" font-size="11" fill="#64748B">Constraints, traffic profile, deadline</text>
      <text x="380" y="128" font-size="11" fill="#2563EB">Day 0</text>

      <line x1="235" y1="150" x2="235" y2="164" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

      <rect x="24" y="166" width="422" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="50" cy="192" r="12" fill="#EFF6FF"/>
      <text x="45" y="196" font-size="10" font-weight="600" fill="#2563EB">02</text>
      <text x="74" y="188" font-size="13" font-weight="600" fill="#0F172A">Schema, routes and milestones land in writing</text>
      <text x="74" y="205" font-size="11" fill="#64748B">Database DDL, API contract, sprint dates</text>
      <text x="374" y="196" font-size="11" fill="#2563EB">Day 1</text>

      <line x1="235" y1="218" x2="235" y2="232" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

      <rect x="24" y="234" width="422" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="50" cy="260" r="12" fill="#EFF6FF"/>
      <text x="45" y="264" font-size="10" font-weight="600" fill="#2563EB">03</text>
      <text x="74" y="256" font-size="13" font-weight="600" fill="#0F172A">The architect builds and reviews the code</text>
      <text x="74" y="273" font-size="11" fill="#64748B">Staging deployed as each milestone closes</text>
      <text x="366" y="264" font-size="11" fill="#2563EB">Day 14</text>

      <line x1="235" y1="286" x2="235" y2="300" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

      <rect x="24" y="302" width="422" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="50" cy="328" r="12" fill="#EFF6FF"/>
      <text x="45" y="332" font-size="10" font-weight="600" fill="#2563EB">04</text>
      <text x="74" y="324" font-size="13" font-weight="600" fill="#0F172A">Repository, keys and runbooks transfer to you</text>
      <text x="74" y="341" font-size="11" fill="#64748B">Full history, no proprietary lock in</text>
      <text x="378" y="332" font-size="11" fill="#2563EB">Day 21</text>
    </g>

    <rect x="24" y="372" width="422" height="62" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="40" y="396" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#065F46">Effective engineering rate</text>
    <text x="40" y="418" font-family="Geist Mono, monospace" font-size="12" fill="#047857">21 day timeline, one accountable owner</text>
  </g>
</svg>