<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" fill="none" role="img" aria-label="Agency chain against direct architect engagement, drawn as two flat ledger columns">
  <defs>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="470" fill="#FFFFFF"/>

  <!-- column rules: the structure is hairlines, not panels -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="#0F172A" stroke-width="2"/>
  <line x1="0" y1="46" x2="1000" y2="46" stroke="#E2E8F0"/>
  <line x1="490" y1="0" x2="490" y2="470" stroke="#CBD5E1"/>

  <!-- headers -->
  <text x="0" y="32" font-family="Geist Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#B91C1C">TRADITIONAL AGENCY</text>
  <text x="510" y="32" font-family="Geist Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#1D4ED8">DIRECT ARCHITECT</text>

  <!-- LEFT: agency chain -->
  <text x="0" y="76" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Four layers between you and the code</text>
  <line x1="0" y1="92" x2="470" y2="92" stroke="#E2E8F0"/>

  <g font-family="Geist, sans-serif">
    <text x="0" y="128" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#94A3B8">01</text>
    <text x="40" y="124" font-size="13" font-weight="600" fill="#0F172A">Client brief</text>
    <text x="40" y="141" font-size="11" fill="#64748B">Requirements explained three times</text>
    <text x="440" y="124" font-size="11" fill="#94A3B8" text-anchor="end">Day 1</text>
    <line x1="0" y1="156" x2="470" y2="156" stroke="#E2E8F0"/>

    <text x="0" y="192" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#94A3B8">02</text>
    <text x="40" y="188" font-size="13" font-weight="600" fill="#0F172A">Account manager translates the brief</text>
    <text x="40" y="205" font-size="11" fill="#64748B">Scope drifts, no technical review</text>
    <text x="440" y="188" font-size="11" fill="#94A3B8" text-anchor="end">Day 4</text>
    <line x1="0" y1="220" x2="470" y2="220" stroke="#E2E8F0"/>

    <text x="0" y="256" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#94A3B8">03</text>
    <text x="40" y="252" font-size="13" font-weight="600" fill="#0F172A">Junior developer builds from the ticket</text>
    <text x="40" y="269" font-size="11" fill="#64748B">No architecture owner, no production context</text>
    <text x="440" y="252" font-size="11" fill="#94A3B8" text-anchor="end">Week 3</text>
    <line x1="0" y1="284" x2="470" y2="284" stroke="#E2E8F0"/>

    <text x="0" y="320" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#94A3B8">04</text>
    <text x="40" y="316" font-size="13" font-weight="600" fill="#0F172A">Offshore QA signs off the handoff</text>
    <text x="40" y="333" font-size="11" fill="#64748B">Knowledge leaves with the contract</text>
    <text x="440" y="316" font-size="11" fill="#94A3B8" text-anchor="end">Week 12</text>
  </g>
  <line x1="0" y1="348" x2="470" y2="348" stroke="#CBD5E1"/>

  <text x="0" y="382" font-family="Geist Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#B91C1C">EFFECTIVE RATE</text>
  <text x="0" y="404" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#B91C1C">12 week timeline, no single owner</text>
  <text x="0" y="424" font-family="Geist, sans-serif" font-size="11" fill="#64748B">Senior rate multiplied by three coordination layers.</text>

  <!-- RIGHT: direct -->
  <text x="510" y="76" font-family="Geist, sans-serif" font-size="15" font-weight="600" fill="#0F172A">One line, one owner, every decision</text>
  <line x1="510" y1="92" x2="1000" y2="92" stroke="#2563EB" stroke-width="2"/>

  <g font-family="Geist, sans-serif">
    <text x="510" y="128" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#2563EB">01</text>
    <text x="550" y="124" font-size="13" font-weight="600" fill="#0F172A">You brief the architect directly</text>
    <text x="550" y="141" font-size="11" fill="#64748B">Constraints, traffic profile, deadline</text>
    <text x="1000" y="124" font-size="11" fill="#2563EB" text-anchor="end">Day 0</text>
    <line x1="510" y1="156" x2="1000" y2="156" stroke="#E2E8F0"/>

    <text x="510" y="192" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#2563EB">02</text>
    <text x="550" y="188" font-size="13" font-weight="600" fill="#0F172A">Schema, routes and milestones land in writing</text>
    <text x="550" y="205" font-size="11" fill="#64748B">Database DDL, API contract, sprint dates</text>
    <text x="1000" y="188" font-size="11" fill="#2563EB" text-anchor="end">Day 1</text>
    <line x1="510" y1="220" x2="1000" y2="220" stroke="#E2E8F0"/>

    <text x="510" y="256" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#2563EB">03</text>
    <text x="550" y="252" font-size="13" font-weight="600" fill="#0F172A">The architect builds and reviews the code</text>
    <text x="550" y="269" font-size="11" fill="#64748B">Staging deployed as each milestone closes</text>
    <text x="1000" y="252" font-size="11" fill="#2563EB" text-anchor="end">Day 14</text>
    <line x1="510" y1="284" x2="1000" y2="284" stroke="#E2E8F0"/>

    <text x="510" y="320" font-family="Geist Mono, monospace" font-size="11" font-weight="600" fill="#2563EB">04</text>
    <text x="550" y="316" font-size="13" font-weight="600" fill="#0F172A">Repository, keys and runbooks transfer to you</text>
    <text x="550" y="333" font-size="11" fill="#64748B">Full history, no proprietary lock in</text>
    <text x="1000" y="316" font-size="11" fill="#2563EB" text-anchor="end">Day 21</text>
  </g>
  <line x1="510" y1="348" x2="1000" y2="348" stroke="#CBD5E1"/>

  <text x="510" y="382" font-family="Geist Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#059669">EFFECTIVE RATE</text>
  <text x="510" y="404" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#059669">21 day timeline, one accountable owner</text>
  <text x="510" y="424" font-family="Geist, sans-serif" font-size="11" fill="#64748B">One senior rate, zero coordination tax.</text>

  <line x1="0" y1="469" x2="1000" y2="469" stroke="#0F172A" stroke-width="2"/>
</svg>
