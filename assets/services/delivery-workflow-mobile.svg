<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 500" width="380" height="500" fill="none" role="img" aria-label="Milestone schedule across four weeks: spec lock at 24 hours, build and staging for 10 to 14 working days, then hardening and handover for 3 to 5 days, with a 30 day defect warranty tail">
  <rect x="0" y="0" width="380" height="500" fill="#FFFFFF"/>

  <!-- frame: heavy rules top and bottom -->
  <line x1="0" y1="0.75" x2="380" y2="0.75" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="0" y1="499.25" x2="380" y2="499.25" stroke="#0F172A" stroke-width="1.5"/>

  <!-- header band: 24px side padding, 26px above the text -->
  <text x="24" y="40" font-family="Geist Mono, monospace" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#64748B">MILESTONE SCHEDULE</text>
  <line x1="24" y1="58" x2="356" y2="58" stroke="#E2E8F0"/>

  <!-- week ruler: four 83px columns spanning x 24 to x 356 -->
  <text x="65.5" y="82" font-family="Geist Mono, monospace" font-size="9" letter-spacing="0.04em" fill="#64748B" text-anchor="middle">W1</text>
  <text x="148.5" y="82" font-family="Geist Mono, monospace" font-size="9" letter-spacing="0.04em" fill="#64748B" text-anchor="middle">W2</text>
  <text x="231.5" y="82" font-family="Geist Mono, monospace" font-size="9" letter-spacing="0.04em" fill="#64748B" text-anchor="middle">W3</text>
  <text x="314.5" y="82" font-family="Geist Mono, monospace" font-size="9" letter-spacing="0.04em" fill="#64748B" text-anchor="middle">W4</text>
  <line x1="24" y1="94" x2="356" y2="94" stroke="#E2E8F0"/>

  <!-- row 01: spec lock, one working day -->
  <text x="24" y="122" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#2563EB">01</text>
  <text x="52" y="122" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Spec lock</text>
  <text x="356" y="122" font-family="Geist Mono, monospace" font-size="9" fill="#1D4ED8" text-anchor="end">24h</text>
  <text x="24" y="139" font-family="Geist Mono, monospace" font-size="9" fill="#64748B">Paid on acceptance</text>
  <rect x="24" y="150" width="332" height="14" fill="#F1F5F9"/>
  <line x1="107" y1="150" x2="107" y2="164" stroke="#E2E8F0"/>
  <line x1="190" y1="150" x2="190" y2="164" stroke="#E2E8F0"/>
  <line x1="273" y1="150" x2="273" y2="164" stroke="#E2E8F0"/>
  <rect x="24" y="150" width="12" height="14" fill="#2563EB"/>
  <line x1="24" y1="182" x2="356" y2="182" stroke="#E2E8F0"/>

  <!-- row 02: build and staging, eleven working days -->
  <text x="24" y="210" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#2563EB">02</text>
  <text x="52" y="210" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Build and staging</text>
  <text x="356" y="210" font-family="Geist Mono, monospace" font-size="9" fill="#1D4ED8" text-anchor="end">10 to 14 days</text>
  <text x="24" y="227" font-family="Geist Mono, monospace" font-size="9" fill="#64748B">Staging URL each merge</text>
  <rect x="24" y="238" width="332" height="14" fill="#F1F5F9"/>
  <line x1="107" y1="238" x2="107" y2="252" stroke="#E2E8F0"/>
  <line x1="190" y1="238" x2="190" y2="252" stroke="#E2E8F0"/>
  <line x1="273" y1="238" x2="273" y2="252" stroke="#E2E8F0"/>
  <rect x="36" y="238" width="166" height="14" fill="#BFDBFE"/>
  <line x1="24" y1="270" x2="356" y2="270" stroke="#E2E8F0"/>

  <!-- row 03: hardening and handover, four working days -->
  <text x="24" y="298" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#059669">03</text>
  <text x="52" y="298" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Hardening and handover</text>
  <text x="356" y="298" font-family="Geist Mono, monospace" font-size="9" fill="#047857" text-anchor="end">3 to 5 days</text>
  <text x="24" y="315" font-family="Geist Mono, monospace" font-size="9" fill="#64748B">Load test, keys and runbook</text>
  <rect x="24" y="326" width="332" height="14" fill="#F1F5F9"/>
  <line x1="107" y1="326" x2="107" y2="340" stroke="#E2E8F0"/>
  <line x1="190" y1="326" x2="190" y2="340" stroke="#E2E8F0"/>
  <line x1="273" y1="326" x2="273" y2="340" stroke="#E2E8F0"/>
  <rect x="202" y="326" width="59" height="14" fill="#A7F3D0"/>
  <line x1="24" y1="358" x2="356" y2="358" stroke="#E2E8F0"/>

  <!-- row 04: warranty tail, week four in full -->
  <text x="24" y="386" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#64748B">W</text>
  <text x="52" y="386" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#475569">Defect warranty</text>
  <text x="356" y="386" font-family="Geist Mono, monospace" font-size="9" fill="#047857" text-anchor="end">30 days</text>
  <text x="24" y="403" font-family="Geist Mono, monospace" font-size="9" fill="#64748B">Included, no extra cost</text>
  <rect x="24" y="414" width="332" height="14" fill="#F1F5F9"/>
  <line x1="107" y1="414" x2="107" y2="428" stroke="#E2E8F0"/>
  <line x1="190" y1="414" x2="190" y2="428" stroke="#E2E8F0"/>
  <line x1="273" y1="414" x2="273" y2="428" stroke="#E2E8F0"/>
  <path d="M261 414 H356 M261 414 V428 M261 428 H356" stroke="#059669" stroke-dasharray="4 3"/>

  <!-- the track block closes here, giving the note its own band -->
  <line x1="24" y1="440" x2="356" y2="440" stroke="#E2E8F0"/>

  <!-- footnote: 14px below the rule and clear of the bottom rule -->
  <text x="24" y="464" font-family="Geist, sans-serif" font-size="10" fill="#64748B">Fixed price per milestone. No hourly drift,</text>
  <text x="24" y="479" font-family="Geist, sans-serif" font-size="10" fill="#64748B">no change order surprise after signature.</text>
</svg>
