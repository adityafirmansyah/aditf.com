<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" fill="none">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="flowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="flowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="600" fill="#FFFFFF"/>
  <line x1="0.75" y1="0" x2="0.75" y2="600" stroke="#CBD5E1"/>
  <line x1="1039" y1="0" x2="1039" y2="600" stroke="#CBD5E1"/>
  <line x1="0" y1="0.75" x2="1040" y2="0.75" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="0" y1="599" x2="1040" y2="599" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="42" font-family="Geist Mono, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#94A3B8">REFERENCE ARCHITECTURE · PRODUCTION TOPOLOGY</text>
  <text x="32" y="74" font-family="Geist, sans-serif" font-size="20" font-weight="600" fill="#0F172A">Request path from edge to database</text>
  <line x1="32" y1="94" x2="1008" y2="94" stroke="#E2E8F0"/>

  <!-- Client layer -->
  <g transform="translate(32, 120)">
    <rect width="200" height="72" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="16" y="28" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Browser / PWA</text>
    <text x="16" y="48" font-family="Geist, sans-serif" font-size="11" fill="#64748B">390px to 1920px</text>
    <text x="16" y="63" font-family="Geist Mono, monospace" font-size="10" fill="#94A3B8">LCP budget 1.2s</text>
  </g>

  <line x1="232" y1="156" x2="272" y2="156" stroke="#2563EB" stroke-width="1.5" marker-end="url(#flowBlue)"/>
  <text x="238" y="146" font-family="Geist Mono, monospace" font-size="9" fill="#2563EB">HTTPS/3</text>

  <!-- Edge layer -->
  <g transform="translate(276, 108)">
    <rect width="216" height="96" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="16" y="26" font-family="Geist, sans-serif" font-size="12" font-weight="600" letter-spacing="0.04em" fill="#1D4ED8">EDGE LAYER</text>
    <text x="16" y="50" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Cloudflare CDN</text>
    <text x="16" y="69" font-family="Geist, sans-serif" font-size="11" fill="#475569">TLS, WAF, cache rules</text>
    <text x="16" y="85" font-family="Geist Mono, monospace" font-size="10" fill="#2563EB">~18ms static hit</text>
  </g>

  <line x1="492" y1="156" x2="532" y2="156" stroke="#2563EB" stroke-width="1.5" marker-end="url(#flowBlue)"/>

  <!-- App layer -->
  <g transform="translate(536, 108)">
    <rect width="240" height="96" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="16" y="26" font-family="Geist, sans-serif" font-size="12" font-weight="600" letter-spacing="0.04em" fill="#64748B">APPLICATION</text>
    <text x="16" y="50" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Next.js App Router</text>
    <text x="16" y="69" font-family="Geist, sans-serif" font-size="11" fill="#475569">SSR, ISR, route handlers</text>
    <text x="16" y="85" font-family="Geist Mono, monospace" font-size="10" fill="#94A3B8">typed client contracts</text>
  </g>

  <line x1="776" y1="156" x2="816" y2="156" stroke="#2563EB" stroke-width="1.5" marker-end="url(#flowBlue)"/>

  <!-- Service layer -->
  <g transform="translate(820, 108)">
    <rect width="188" height="96" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="16" y="26" font-family="Geist, sans-serif" font-size="12" font-weight="600" letter-spacing="0.04em" fill="#64748B">SERVICES</text>
    <text x="16" y="50" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#0F172A">FastAPI workers</text>
    <text x="16" y="69" font-family="Geist, sans-serif" font-size="11" fill="#475569">Pydantic v2 schemas</text>
    <text x="16" y="85" font-family="Geist Mono, monospace" font-size="10" fill="#94A3B8">uvicorn · 4 procs</text>
  </g>

  <!-- Vertical drop to data layer -->
  <line x1="914" y1="204" x2="914" y2="248" stroke="#059669" stroke-width="1.5" marker-end="url(#flowGreen)"/>

  <!-- Data layer row -->
  <g transform="translate(536, 252)">
    <rect width="472" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="16" y="26" font-family="Geist, sans-serif" font-size="12" font-weight="600" letter-spacing="0.04em" fill="#64748B">DATA LAYER</text>

    <g transform="translate(16, 38)">
      <rect width="136" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="12" y="24" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#0F172A">PostgreSQL 16</text>
      <text x="12" y="42" font-family="Geist Mono, monospace" font-size="10" fill="#475569">indexed reads 0.8ms</text>
    </g>

    <g transform="translate(164, 38)">
      <rect width="136" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="12" y="24" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Redis 7</text>
      <text x="12" y="42" font-family="Geist Mono, monospace" font-size="10" fill="#475569">tenant cache 0.3ms</text>
    </g>

    <g transform="translate(312, 38)">
      <rect width="144" height="58" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="12" y="24" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#065F46">Object storage</text>
      <text x="12" y="42" font-family="Geist Mono, monospace" font-size="10" fill="#047857">signed uploads</text>
    </g>
  </g>

  <!-- Return path arrow back to app layer -->
  <path d="M 536 308 H 508 V 156 H 536" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-dasharray="5 5" marker-end="url(#flow)"/>
  <text x="404" y="300" font-family="Geist Mono, monospace" font-size="9" fill="#94A3B8" transform="rotate(-90 404 300)">JSON response</text>

  <!-- Reliability band -->
  <g transform="translate(32, 252)">
    <rect width="472" height="112" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="16" y="26" font-family="Geist, sans-serif" font-size="12" font-weight="600" letter-spacing="0.04em" fill="#64748B">DELIVERY &amp; OBSERVABILITY</text>

    <g font-family="Geist, sans-serif" font-size="12" fill="#334155">
      <circle cx="22" cy="48" r="3" fill="#059669"/>
      <text x="34" y="52">Staging deploy on every merged milestone</text>

      <circle cx="22" cy="70" r="3" fill="#059669"/>
      <text x="34" y="74">Idempotent payment callbacks with retry ledger</text>

      <circle cx="22" cy="92" r="3" fill="#059669"/>
      <text x="34" y="96">Structured logs, uptime probes, error budgets</text>
    </g>
  </g>

  <!-- Bottom legend -->
  <g transform="translate(32, 396)">
    <line x1="0" y1="0" x2="1008" y2="0" stroke="#E2E8F0"/>
    <g transform="translate(0, 24)" font-family="Geist, sans-serif" font-size="11" fill="#64748B">
      <rect x="0" y="-9" width="10" height="10" rx="2" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="18" y="0">Edge cacheable</text>

      <rect x="132" y="-9" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="150" y="0">Origin rendered</text>

      <rect x="272" y="-9" width="10" height="10" rx="2" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="290" y="0">Durable storage</text>
    </g>

    <g transform="translate(0, 62)" font-family="Geist Mono, monospace" font-size="11" fill="#94A3B8">
      <text x="0" y="0">Deploy unit: docker compose · reverse proxy: Caddy · CI gate: lint, typecheck, vitest, lighthouse</text>
    </g>
  </g>

  <!-- Measured results strip -->
  <g transform="translate(32, 502)">
    <rect width="1008" height="66" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <g font-family="Geist, sans-serif">
      <text x="24" y="26" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#94A3B8">MEASURED ON SHIPPED WORK</text>
      <text x="24" y="50" font-size="13" font-weight="600" fill="#0F172A">TTFB 41ms</text>
      <text x="150" y="50" font-size="13" font-weight="600" fill="#0F172A">p99 34ms</text>
      <text x="268" y="50" font-size="13" font-weight="600" fill="#0F172A">20,000 SKU catalog</text>
      <text x="474" y="50" font-size="13" font-weight="600" fill="#0F172A">99.98% availability</text>
      <text x="658" y="50" font-size="13" font-weight="600" fill="#0F172A">188 tests green</text>
      <text x="838" y="50" font-size="13" font-weight="600" fill="#059669">0 critical CVEs</text>
    </g>
  </g>
</svg>