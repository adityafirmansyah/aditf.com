<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" width="400" height="900" fill="none" role="img" aria-label="Agency chain and direct architect engagement as two stacked ledgers">
  <!-- LEFT PANEL: agency chain, drawn as ledger rows -->
  <g>
    <line x1="0" y1="0" x2="400" y2="0" stroke="#0F172A" stroke-width="2"/>
    <line x1="0" y1="40" x2="400" y2="40" stroke="#E2E8F0"/>
    <text x="0" y="27" font-family="Geist Mono, monospace" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B91C1C">TRADITIONAL AGENCY</text>
    <text x="0" y="66" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Four layers to the code</text>

    <g font-family="Geist, sans-serif">
      <text x="0" y="96" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#94A3B8">01</text>
      <text x="32" y="96" font-size="11" font-weight="600" fill="#0F172A">Client brief</text>
      <text x="32" y="113" font-size="10" fill="#64748B">Requirements explained three times</text>
      <text x="400" y="96" font-size="10" fill="#94A3B8" text-anchor="end">Day 1</text>
      <line x1="0" y1="128" x2="400" y2="128" stroke="#E2E8F0"/>

      <text x="0" y="156" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#94A3B8">02</text>
      <text x="32" y="156" font-size="11" font-weight="600" fill="#0F172A">Account manager translates</text>
      <text x="32" y="173" font-size="10" fill="#64748B">Scope drifts, no technical review</text>
      <text x="400" y="156" font-size="10" fill="#94A3B8" text-anchor="end">Day 4</text>
      <line x1="0" y1="188" x2="400" y2="188" stroke="#E2E8F0"/>

      <text x="0" y="216" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#94A3B8">03</text>
      <text x="32" y="216" font-size="11" font-weight="600" fill="#0F172A">Junior builds from the ticket</text>
      <text x="32" y="233" font-size="10" fill="#64748B">No architecture owner in the room</text>
      <text x="400" y="216" font-size="10" fill="#94A3B8" text-anchor="end">Week 3</text>
      <line x1="0" y1="248" x2="400" y2="248" stroke="#E2E8F0"/>

      <text x="0" y="276" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#94A3B8">04</text>
      <text x="32" y="276" font-size="11" font-weight="600" fill="#0F172A">Offshore QA signs the handoff</text>
      <text x="32" y="293" font-size="10" fill="#64748B">Knowledge leaves with the contract</text>
      <text x="400" y="276" font-size="10" fill="#94A3B8" text-anchor="end">Week 12</text>
    </g>
    <line x1="0" y1="308" x2="400" y2="308" stroke="#CBD5E1"/>

    <text x="0" y="334" font-family="Geist Mono, monospace" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#B91C1C">EFFECTIVE RATE</text>
    <text x="0" y="352" font-family="Geist Mono, monospace" font-size="10" fill="#7F1D1D">Senior rate × 3.0 overhead</text>
    <line x1="0" y1="372" x2="400" y2="372" stroke="#0F172A" stroke-width="2"/>
  </g>

  <!-- RIGHT PANEL: direct architect -->
  <g transform="translate(0, 440)">
    <line x1="0" y1="0" x2="400" y2="0" stroke="#0F172A" stroke-width="2"/>
    <line x1="0" y1="40" x2="400" y2="40" stroke="#2563EB" stroke-width="2"/>
    <text x="0" y="27" font-family="Geist Mono, monospace" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#1D4ED8">DIRECT ARCHITECT</text>
    <text x="0" y="66" font-family="Geist, sans-serif" font-size="13" font-weight="600" fill="#0F172A">One line, one owner</text>

    <g font-family="Geist, sans-serif">
      <text x="0" y="96" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#2563EB">01</text>
      <text x="32" y="96" font-size="11" font-weight="600" fill="#0F172A">You brief the architect</text>
      <text x="32" y="113" font-size="10" fill="#64748B">Constraints, traffic profile, deadline</text>
      <text x="400" y="96" font-size="10" fill="#2563EB" text-anchor="end">Day 0</text>
      <line x1="0" y1="128" x2="400" y2="128" stroke="#E2E8F0"/>

      <text x="0" y="156" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#2563EB">02</text>
      <text x="32" y="156" font-size="11" font-weight="600" fill="#0F172A">Schema and milestones in writing</text>
      <text x="32" y="173" font-size="10" fill="#64748B">Database DDL, API contract, sprint dates</text>
      <text x="400" y="156" font-size="10" fill="#2563EB" text-anchor="end">Day 1</text>
      <line x1="0" y1="188" x2="400" y2="188" stroke="#E2E8F0"/>

      <text x="0" y="216" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#2563EB">03</text>
      <text x="32" y="216" font-size="11" font-weight="600" fill="#0F172A">Architect builds and reviews</text>
      <text x="32" y="233" font-size="10" fill="#64748B">Staging deployed as milestones close</text>
      <text x="400" y="216" font-size="10" fill="#2563EB" text-anchor="end">Day 14</text>
      <line x1="0" y1="248" x2="400" y2="248" stroke="#E2E8F0"/>

      <text x="0" y="276" font-family="Geist Mono, monospace" font-size="10" font-weight="600" fill="#2563EB">04</text>
      <text x="32" y="276" font-size="11" font-weight="600" fill="#0F172A">Repository and keys transfer</text>
      <text x="32" y="293" font-size="10" fill="#64748B">Full history, no proprietary lock in</text>
      <text x="400" y="276" font-size="10" fill="#2563EB" text-anchor="end">Day 21</text>
    </g>
    <line x1="0" y1="308" x2="400" y2="308" stroke="#CBD5E1"/>

    <text x="0" y="334" font-family="Geist Mono, monospace" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#059669">EFFECTIVE RATE</text>
    <text x="0" y="352" font-family="Geist Mono, monospace" font-size="10" fill="#047857">One senior rate, zero tax</text>
    <line x1="0" y1="372" x2="400" y2="372" stroke="#0F172A" stroke-width="2"/>
  </g>
</svg>
